<!DOCTYPE html>
<!--
  KURODAIYA - browser version (for itch.io and any static host)

  This page embeds WebMSX (https://webmsx.org) in an iframe. It does NOT bundle
  the emulator: WebMSX ships the MSX system BIOS inside wmsx.js, and we are not
  in a position to redistribute that. Linking to the emulator keeps this page to
  our own ROM only. WebMSX's author has asked that embeddings keep the original
  experience and credit the project - the footer below does that.

  The ROM is read by webmsx.org, which is a different origin, so it has to be
  served with CORS. raw.githubusercontent.com sends `Access-Control-Allow-Origin: *`;
  itch.io's own file hosting does not, so the ROM cannot live inside the itch ZIP.

  URL parameters, and why each one is here:
    ROM          the cartridge, on raw.githubusercontent.com (always the latest release)
    ROM_FORMAT   ASCII8 - a 256KB ASCII8 MegaROM. Auto-detection finds it too;
                 stating it removes the guess.
    M            MSX2PJ (MSX2+ Japan). The game only drives the turbo R PCM on a
                 turbo R, and WebMSX does not emulate that chip, so MSX2+ is the
                 configuration where the browser matches real hardware exactly.
    P            RAM128 - WebMSX defaults to a 512KB RAM mapper, whose power-on
                 memory check takes far longer than the game needs.
    FAST_BOOT    0 - off. Let the MSX boot normally and show its own logo; it is
                 part of the machine, and the title is up in about 7 seconds.
                 Any other value runs the boot at 10x for a FRAME COUNT, not until
                 the BIOS finishes, so a count that outlasts the boot runs the
                 GAME at 10x: the title music races, and where the CPU cannot keep
                 up (a nested iframe, say) the emulator stalls on a held note.
                 Measured here: this machine reaches the title at ~400 frames, and
                 even the "auto" value (1 = 380 frames) overshoots into the game.
    OPLL_VOL     raise the FM volume so the music is audible.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KURODAIYA</title>
<style>
  :root {
    --bg: #0d0b0a;
    --fg: #d9cfc2;
    --dim: #8a7f72;
    --line: #2a2320;
    --link: #e0a85c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #screen {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
    background: #000;
  }
  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 8px 16px;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    align-items: baseline;
  }
  footer b { color: var(--fg); font-weight: 600; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    footer { padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<iframe
  id="screen"
  title="KURODAIYA running on WebMSX"
  allow="gamepad; fullscreen; autoplay"
  src="https://webmsx.org/?ROM=https%3A%2F%2Fraw.githubusercontent.com%2Fsuzuki-black%2FSakiyamaBlast%2Fmain%2Fweb%2Fkurodaiya.rom&amp;ROM_FORMAT=ASCII8&amp;M=MSX2PJ&amp;P=RAM128&amp;FAST_BOOT=0&amp;OPLL_VOL=F"></iframe>

<footer>
  <span><b>Click the screen first</b> &mdash; that starts the sound. Arrow keys move, <b>Space</b> digs and sets charges.</span>
  <span>Running as an <b>MSX2+</b>. On a real turbo R the game runs at 60fps and adds PCM percussion, which no browser emulator reproduces yet.</span>
  <span>Emulation by <a href="https://webmsx.org" target="_blank" rel="noopener">WebMSX</a>. Game source and ROM downloads: <a href="https://github.com/suzuki-black/SakiyamaBlast" target="_blank" rel="noopener">GitHub</a>.</span>
</footer>

</body>
</html>
